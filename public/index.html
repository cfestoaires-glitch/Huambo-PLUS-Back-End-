<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huambo Plus</title>
    
    <!-- Biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Estilos base para a aplicação -->
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 10px;
            color: #0f172a;
        }
        header {
            text-align: center;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0 0 5px 0;
            color: #1e293b;
        }
        p.subtitle {
            font-size: 0.8rem;
            color: #64748b;
            margin: 0;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>Huambo Plus</h1>
        <p class="subtitle">Encontre prestadores de serviços de confiança na região</p>
    </header>

    <main>
        <!-- Aba Principal: Escolha de Perfil, Registos e Admin -->
        <div id="aba-registar" class="tab-content active"></div>

        <!-- Aba Secundária: Lista de Prestadores Aprovados -->
        <div id="aba-buscar" class="tab-content" style="max-width: 450px; margin: 0 auto;">
            <h3 style="font-size: 1rem; margin-bottom: 10px; color: #1e293b;">Prestadores Disponíveis</h3>
            <div id="container-cards"></div>
        </div>
    </main>

    <!-- Script principal da aplicação -->
    <script src="app.js"></script>
</body>
</html>
