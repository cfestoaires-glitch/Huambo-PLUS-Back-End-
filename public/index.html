<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huambo Plus</title>
    
    <!-- IMPORTANTE: Biblioteca do Supabase necessária para ligar à base de dados -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 10px;
            color: #1e293b;
        }
        header {
            text-align: center;
            padding: 15px 0;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0;
            color: #0f172a;
        }
        p.subtitle {
            font-size: 0.8rem;
            color: #64748b;
            margin: 4px 0 15px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Huambo Plus</h1>
        <p class="subtitle">Encontre prestadores de serviços de confiança na região</p>
    </header>

    <main>
        <!-- Elemento crucial onde o app.js vai desenhar os perfis -->
        <div id="aba-registar"></div>
        
        <!-- Elemento onde a lista de prestadores aprovados vai aparecer -->
        <div id="container-cards" style="max-width: 450px; margin: 20px auto;"></div>
    </main>

    <!-- O script JavaScript principal -->
    <script src="app.js"></script>
</body>
</html>
