<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huambo Plus - Plataforma de Serviços</title>
    
    <!-- CSS Principal -->
    <link rel="stylesheet" href="/style.css">
    
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet.js para Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <!-- Navegação -->
    <nav class="navbar">
        <div class="logo">Huambo<span>Plus</span></div>
        <div class="nav-links">
            <button class="nav-btn active" data-tab="busca" data-i18n="navBusca">Buscar</button>
            <button class="nav-btn" data-tab="gritos" data-i18n="navGritos">Mural de Gritos</button>
            <button class="nav-btn" data-tab="registo" data-i18n="navRegisto">Registo Prestador</button>
        </div>
        <div class="nav-actions">
            <select id="seletor-idioma">
                <option value="PT">PT</option>
                <option value="EN">EN</option>
                <option value="UMB">UMB</option>
            </select>
            <button id="btn-tema" title="Alternar Tema"><i class="fa-solid fa-moon"></i></button>
            <button id="btn-login-modal" class="btn-primary" data-i18n="btnLogin">Entrar</button>
        </div>
    </nav>

    <main class="container">
        <!-- ABA 1: BUSCA -->
        <section id="aba-busca" class="tab-content active">
            <div class="search-bar">
                <input type="text" id="campo-busca" placeholder="Ex: Canalizador, Eletricista..." data-i18n-placeholder="searchPlaceholder">
                <select id="filtro-municipio">
                    <option value="" data-i18n="todosMunicipios">Todos os Municípios</option>
                </select>
                <select id="filtro-categoria">
                    <option value="" data-i18n="todasCategorias">Todas as Categorias</option>
                </select>
                <button id="btn-executar-busca" class="btn-primary" data-i18n="btnPesquisar">Pesquisar</button>
            </div>

            <div class="view-toggle">
                <button id="btn-view-cards" class="active" data-i18n="viewLista">Lista</button>
                <button id="btn-view-map" data-i18n="viewMapa">Mapa</button>
            </div>

            <!-- Lista de Prestadores -->
            <div id="container-cards" class="cards-grid"></div>

            <!-- Contentor do Mapa -->
            <div id="map-container" class="map-hidden">
                <div id="map"></div>
            </div>
        </section>

        <!-- ABA 2: MURAL DE GRITOS -->
        <section id="aba-gritos" class="tab-content">
            <h2 data-i18n="gritosTitulo">Mural de Pedidos Rápidos (Gritos)</h2>
            <div id="container-gritos"></div>
        </section>

        <!-- ABA 3: REGISTO DE PRESTADOR -->
        <section id="aba-registo" class="tab-content">
            <h2 data-i18n="registoTitulo">Candidatura de Prestador de Serviços</h2>
            <form id="form-prestador" class="form-box">
                <label data-i18n="labelNome">Nome Completo</label>
                <input type="text" id="reg-nome" required>

                <label>NIF</label>
                <input type="text" id="reg-nif">

                <label data-i18n="labelCategoria">Categoria / Profissão</label>
                <select id="reg-categoria" required></select>

                <label data-i18n="labelMunicipio">Município</label>
                <select id="reg-municipio" required></select>

                <label data-i18n="labelTelefone">Telefone / WhatsApp</label>
                <input type="text" id="reg-telefone" required>

                <label data-i18n="labelTaxa">Taxa de Deslocação (Kz)</label>
                <input type="number" id="reg-taxa" value="0">

                <button type="submit" class="btn-primary" data-i18n="btnSubmeter">Submeter Candidatura</button>
            </form>
        </section>
    </main>

    <!-- MODAL DE LOGIN -->
    <div id="modal-login" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 data-i18n="loginTitulo">Acessar Conta</h2>
            <form id="form-login">
                <label>Email</label>
                <input type="email" id="login-email" required>
                <label data-i18n="labelSenha">Senha</label>
                <input type="password" id="login-senha" required>
                <button type="submit" class="btn-primary" data-i18n="btnLogin">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Script Principal -->
    <script src="/app.js"></script>
</body>
</html>
